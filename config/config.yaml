broker:
  name: "zerodha"
  api_key: "YOUR_API_KEY"
  api_secret: "YOUR_API_SECRET"
  access_token: "YOUR_ACCESS_TOKEN"
  capital: 100000
  # token_map enables exchange-aware ticks; map instrument token -> {symbol, exchange}
  # token_map:
  #   "123456": {symbol: "GOLDBEES", exchange: "NSE"}
  #   "234567": {symbol: "GOLDBEES", exchange: "BSE"}
  #   "345678": {symbol: "SILVERBEES", exchange: "NSE"}
  #   "456789": {symbol: "SILVERBEES", exchange: "BSE"}

strategies:
  - name: "MeanReversion"
    class: "strategies.mean_revert.MeanReversionStrategy"
    enabled: true
    parameters:
      lookback_window: 20
      entry_threshold: 2.5
      exit_threshold: 0.5
      symbol: "INFY"
      quantity: 50
  - name: "TrendFollow"
    class: "strategies.trend_follow.TrendFollowStrategy"
    enabled: true
    parameters:
      ma_length: 50
      symbol: "RELIANCE"
      quantity: 50
      take_profit: 0.02
      stop_loss: 0.01
  # Example wire-up for cross-exchange arbitrage (requires exchange-aware ticks and instrument mapping)
  # - name: "ArbGoldSilver"
  #   class: "strategies.arbitrage_cross_exchange.ArbitrageCrossExchangeStrategy"
  #   enabled: false
  #   parameters:
  #     symbols: ["GOLDBEES", "SILVERBEES"]

risk:
  max_position_per_trade: 100
  max_daily_drawdown: 0.05
  max_total_leverage: 2.0
  max_orders_per_minute: 60

notifications:
  slack_webhook: ""
  telegram_bot_token: ""
  telegram_chat_id: ""

schedule:
  trading_hours:
    start: "09:15"
    end: "15:30"
  run_heartbeat_every: 60
